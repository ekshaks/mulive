# Copy to config.yml and choose providers exactly as in a Mulive app bundle.
stt:
  provider: faster_whisper  # faster_whisper | mlx | deepgram
  model_size: tiny
  language: en
  timeout_seconds: 30

vad:
  backend: onnx             # onnx | torch

tts:
  enabled: true
  provider: piper           # piper | kokoro_fastapi | kokoro_onnx
