<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Sign in · Mulive</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #101827; color: #f8fafc; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at top left, #1d4ed855, transparent 38rem), #101827; }
    main { width: min(26rem, calc(100% - 2rem)); padding: 2rem; border: 1px solid #334155; border-radius: 1rem; background: #172033dd; box-shadow: 0 1.5rem 4rem #02061766; }
    p { color: #cbd5e1; } label { display: grid; gap: .5rem; font-weight: 700; } input { width: 100%; padding: .8rem; border: 1px solid #475569; border-radius: .6rem; background: #0f172a; color: inherit; font: inherit; } button { width: 100%; margin-top: 1.25rem; padding: .8rem; border: 0; border-radius: .6rem; background: #2563eb; color: white; font: inherit; font-weight: 700; cursor: pointer; } button:hover { background: #1d4ed8; } #error { color: #fca5a5; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <p>Mulive</p>
    <h1>Sign in</h1>
    <p>Enter the shared password to access this app server.</p>
    <p id="error" hidden>That password was not accepted.</p>
    <form method="post" action="/login">
      <input id="next" name="next" type="hidden">
      <label for="password">Password
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      </label>
      <button type="submit">Continue</button>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("next").value = params.get("next") || "/";
    document.getElementById("error").hidden = params.get("error") !== "1";
  </script>
</body>
</html>
