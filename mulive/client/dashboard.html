<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Mulive Apps</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
  <main class="dashboard">
    <header>
      <div class="dashboard-header-row">
        <p class="eyebrow">Mulive</p>
        <div id="userSelector" class="user-selector-host" aria-label="Current user"></div>
        <form class="logout-form" action="/logout" method="post">
          <button type="submit">Sign out</button>
        </form>
      </div>
      <h1>Choose an app</h1>
      <p class="introduction">Choose an app to start a new session.</p>
    </header>

    <section id="appList" class="app-list" aria-live="polite">
      <p class="status">Loading apps…</p>
    </section>
  </main>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
