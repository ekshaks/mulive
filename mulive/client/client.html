<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Mulive</title>
  <link rel="stylesheet" href="/css/session.css">
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="icon-mic-on" viewBox="0 0 24 24">
      <path d="M12 2a3 3 0 00-3 3v6a3 3 0 006 0V5a3 3 0 00-3-3z"/>
      <path d="M5 10v1a7 7 0 0014 0v-1M12 18v4M8 22h8"/>
    </symbol>
    <symbol id="icon-mic-off" viewBox="0 0 24 24">
      <path d="M12 2a3 3 0 00-3 3v6a3 3 0 004.1 2.8M15 9V5a3 3 0 00-5.3-1.9M5 10v1a7 7 0 0011.9 5M19 10v1a7 7 0 01-.5 2.6M12 18v4M8 22h8M3 3l18 18"/>
    </symbol>
    <symbol id="icon-camera-on" viewBox="0 0 24 24">
      <path d="M15 10l4.6-2.7a.9.9 0 011.4.8v7.8a.9.9 0 01-1.4.8L15 14"/>
      <path d="M4 6h9a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z"/>
    </symbol>
    <symbol id="icon-camera-off" viewBox="0 0 24 24">
      <path d="M15 10l4.6-2.7a.9.9 0 011.4.8v7.8a.9.9 0 01-1.4.8L15 14M4 6h9a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2zM3 3l18 18"/>
    </symbol>
  </svg>
  <main class="app-shell">
    <header class="app-header">
      <h1 id="appName" class="brand">Mulive</h1>
      <div class="header-actions">
        <a id="appsLink" href="/" hidden>Apps</a>
        <div id="userSelector" class="user-selector-host" aria-label="Current user"></div>
        <form class="logout-form" action="/logout" method="post">
          <button type="submit">Sign out</button>
        </form>
        <div id="connectionStatus" class="connection-status" data-state="connecting" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </div>
    </header>

    <section class="workspace" aria-label="Live session">
      <section class="panel transcript-panel" aria-labelledby="conversationHeading">
        <header class="panel-header">
          <h2 id="conversationHeading">Conversation</h2>
          <span class="panel-hint">Scroll to review earlier messages</span>
        </header>
        <div id="transcriptionText" class="transcription-text" tabindex="0" role="log" aria-live="polite" aria-relevant="additions">
          <p class="empty-state">Your live transcript will appear here.</p>
        </div>
      </section>

      <section id="videoPanel" class="panel video-panel" data-video="off" data-minimized="false" aria-label="Camera preview">
        <header class="video-toolbar">
          <span>Camera preview</span>
          <div class="video-toolbar-actions">
            <button id="cameraToggleBtn" class="camera-toggle-btn" type="button" aria-pressed="false" aria-label="Turn camera on">
              <svg class="control-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
                <use href="#icon-camera-off"></use>
              </svg>
              <span class="btn-text">Camera off</span>
            </button>
            <button id="minimizeVideoBtn" class="minimize-video-btn" type="button" aria-expanded="true" aria-controls="videoFrame videoState" aria-label="Minimize camera preview">
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </button>
          </div>
        </header>
        <div id="videoFrame" class="video-frame">
          <video id="localVideo" autoplay playsinline muted></video>
          <div class="video-placeholder" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="M15 10l4.6-2.7a.9.9 0 011.4.8v7.8a.9.9 0 01-1.4.8L15 14M4 6h9a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2z"/>
            </svg>
            <span>Camera is off</span>
          </div>
        </div>
        <div id="videoState" class="video-state" aria-live="polite">Video off</div>
      </section>
    </section>

    <div id="appOverlay" class="app-overlay" role="group" aria-label="App actions and status"></div>

    <div id="celebration" class="celebration" hidden aria-live="polite">
      <div class="celebration-message">Correct! 🎉</div>
    </div>

    <nav class="control-dock" aria-label="Session controls">
      <button id="muteAudioBtn" class="dock-action" type="button" aria-pressed="false" aria-label="Turn microphone on">
        <svg class="control-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2">
          <use href="#icon-mic-off"></use>
        </svg>
        <span class="btn-text">Mic off</span>
      </button>
      <div id="appControls" class="app-controls" role="group" aria-label="App controls"></div>
    </nav>
  </main>

  <script type="module" src="/js/sessionApp.js"></script>
</body>
</html>
